name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Typecheck, lint, build, migrate & seed
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: jojohrspace
      SESSION_TTL_HOURS: 8
      CRON_SECRET: ci-cron-secret-123456789012345678901234
      FIELD_KEY_VERSION: 1
      SUPER_ADMIN_EMAIL: ci-admin@example.com
      SUPER_ADMIN_PASSWORD: ci-only-password-123456
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Prepare runtime secrets
        run: |
          echo "AUTH_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
          echo "FIELD_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "FIELD_HMAC_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Core behavior tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Apply migrations
        run: npm run db:migrate

      - name: Seed master data
        run: npm run db:seed

      - name: Contract transaction regression test
        run: HR_RUN_DB_INTEGRATION=1 node --import tsx --test tests/contracts.integration.ts
